<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>p5.js 작품 모음</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 40px 24px;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
    }
    h1 { margin-bottom: 8px; font-size: 2rem; }
    .subtitle { margin-bottom: 28px; opacity: 0.85; }

    #projects {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      width: 100%;
      max-width: 760px;
      align-items: start;
    }

    .cell {
      position: relative;
      width: 100%;
      overflow: hidden;
      border-radius: 12px;
      background: #000;
      box-shadow: 0 8px 24px rgba(0,0,0,0.35);
      transition: transform 0.25s ease;
    }
    .cell:hover { transform: translateY(-6px) scale(1.02); }

    .cell .label {
      position: absolute;
      top: 10px; left: 10px;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      font-size: 0.8rem;
      font-weight: 600;
      background: rgba(0,0,0,0.6);
      border-radius: 20px;
      backdrop-filter: blur(4px);
    }
    .label .badge {
      font-size: 0.62rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 10px;
    }
    .badge.static  { background: #4caf50; }   /* 정적 */
    .badge.dynamic { background: #ff7043; }    /* 동적 */

    .cell iframe {
      position: absolute;
      top: 0; left: 0;
      transform-origin: top left;
      border: none;
    }
  </style>
</head>
<body>
  <h1>나의 p5.js 작품</h1>
  <p class="subtitle">추상화와 캐릭터, 정적에서 동적으로 (2×2)</p>

  <main id="projects">
    <div class="cell" data-w="600" data-h="400">
      <span class="label"><span class="badge static">정적</span>과제 1 · 추상화 그리기</span>
      <iframe src="sample1/index.html" scrolling="no"></iframe>
    </div>
    <div class="cell" data-w="600" data-h="400">
      <span class="label"><span class="badge dynamic">동적</span>과제 4 · 추상화에 움직임 넣기</span>
      <iframe src="sample4/index.html" scrolling="no"></iframe>
    </div>
    <div class="cell" data-w="400" data-h="600">
      <span class="label"><span class="badge static">정적</span>과제 2 · 캐릭터 그리기</span>
      <iframe src="sample2/index.html" scrolling="no"></iframe>
    </div>
    <div class="cell" data-w="400" data-h="600">
      <span class="label"><span class="badge dynamic">동적</span>과제 3 · 움직이는 캐릭터</span>
      <iframe src="sample3/index.html" scrolling="no"></iframe>
    </div>
  </main>

  <script>
    function fit() {
      document.querySelectorAll('.cell').forEach(cell => {
        const w = +cell.dataset.w;
        const h = +cell.dataset.h;
        const f = cell.querySelector('iframe');
        const scale = cell.clientWidth / w;
        cell.style.height = (h * scale) + 'px';
        f.style.width  = w + 'px';
        f.style.height = h + 'px';
        f.style.transform = 'scale(' + scale + ')';
      });
    }
    window.addEventListener('load', fit);
    window.addEventListener('resize', fit);
  </script>
</body>
</html>
