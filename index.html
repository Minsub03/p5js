<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>p5.js 작품 모음</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 40px 24px;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
    }
    h1 { margin-bottom: 8px; font-size: 2rem; }
    .subtitle { margin-bottom: 28px; opacity: 0.85; }

    #projects {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      width: 100%;
      max-width: 760px;
      align-items: start;          /* 칸 높이 제각각 허용 */
    }

    .cell {
      position: relative;
      width: 100%;
      overflow: hidden;            /* 넘침/검은여백 숨김 */
      border-radius: 12px;
      background: #000;
      box-shadow: 0 8px 24px rgba(0,0,0,0.35);
      transition: transform 0.25s ease;
    }
    .cell:hover { transform: translateY(-6px) scale(1.02); }

    .cell .label {
      position: absolute;
      top: 8px; left: 8px;
      z-index: 2;
      padding: 3px 10px;
      font-size: 0.75rem;
      background: rgba(0,0,0,0.55);
      border-radius: 6px;
    }
    .cell iframe {
      position: absolute;
      top: 0; left: 0;
      transform-origin: top left;
      border: none;
    }
  </style>
</head>
<body>
  <h1>나의 p5.js 작품</h1>
  <p class="subtitle">정적 작품과 동적 작품 모음 (2×2)</p>

  <main id="projects">
    <div class="cell" data-w="600" data-h="400"><span class="label">과제 1</span><iframe src="sample1/index.html" scrolling="no"></iframe></div>
    <div class="cell" data-w="600" data-h="400"><span class="label">과제 4</span><iframe src="sample4/index.html" scrolling="no"></iframe></div>
    <div class="cell" data-w="400" data-h="600"><span class="label">과제 2</span><iframe src="sample2/index.html" scrolling="no"></iframe></div>
    <div class="cell" data-w="400" data-h="600"><span class="label">과제 3</span><iframe src="sample3/index.html" scrolling="no"></iframe></div>
  </main>

  <script>
    function fit() {
      document.querySelectorAll('.cell').forEach(cell => {
        const w = +cell.dataset.w;
        const h = +cell.dataset.h;
        const f = cell.querySelector('iframe');
        const scale = cell.clientWidth / w;
        cell.style.height = (h * scale) + 'px';   // 칸 높이를 캔버스 비율에 맞춤
        f.style.width  = w + 'px';
        f.style.height = h + 'px';
        f.style.transform = 'scale(' + scale + ')';
      });
    }
    window.addEventListener('load', fit);
    window.addEventListener('resize', fit);
  </script>
</body>
</html>
